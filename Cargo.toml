[package]
name = "worktree-compose"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Manage Docker Compose environments across git worktrees"
license = "MIT"

[[bin]]
name = "worktree-compose"
path = "src/main.rs"

[[bin]]
name = "wtc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
owo-colors = "4"
fs2 = "0.4"
serde_yaml_ng = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
indoc = "2"
