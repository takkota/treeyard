name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            components: clippy, rustfmt
            checks: true
          - os: macos-latest
            components: ""
            checks: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.components }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        if: matrix.checks
      - run: cargo clippy -- -D warnings
        if: matrix.checks
      - run: cargo test

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: treeyard-x86_64-linux
            artifact_tyd: tyd-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: treeyard-aarch64-linux
            artifact_tyd: tyd-aarch64-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: treeyard-x86_64-darwin
            artifact_tyd: tyd-x86_64-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: treeyard-aarch64-darwin
            artifact_tyd: tyd-aarch64-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binaries
        run: |
          cp target/${{ matrix.target }}/release/treeyard ${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/tyd ${{ matrix.artifact_tyd }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact_tyd }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
